<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расчет упаковки и документов</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --success-color: #10b981;
            --gray-light: #f3f4f6;
            --border-color: #d1d5db;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9fafb;
            color: #1f2937;
        }
        .no-print {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h2 { color: var(--primary-color); margin-top: 0; }
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #4b5563;
        }
        .form-group input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: 2px solid var(--primary-color);
        }
        
        .main-table-container {
            overflow-x: auto;
            margin-bottom: 25px;
        }
        table.main-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }
        table.main-table th {
            background-color: var(--primary-color);
            color: white;
            padding: 10px;
            font-weight: normal;
        }
        table.main-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            background-color: #ffffff;
        }
        table.main-table tr.calc-row td {
            background-color: #f9fafb;
            font-weight: bold;
        }
        .status-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            display: inline-block;
        }
        .status-yes { background-color: #d1fae5; color: #065f46; }
        .status-no { background-color: #e5e7eb; color: #374151; }

        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: #6b7280;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .print-actions {
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-end;
        }
        .btn-print {
            background-color: var(--success-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-print:hover { background-color: #059669; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Print Documents Styling */
        .doc-page-vertical {
            width: 210mm;
            min-height: 297mm;
            background: white;
            margin: 0 auto 30px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            padding: 15mm;
            box-sizing: border-box;
        }
        .doc-page-horizontal {
            width: 297mm;
            min-height: 210mm;
            background: white;
            margin: 0 auto 30px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            padding: 15mm;
            box-sizing: border-box;
        }

        /* Soprovoditelny List (Vertical, 2 parts) */
        .soprovod-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }
        .soprovod-part {
            border: 2px solid #000;
            padding: 15px;
            box-sizing: border-box;
            height: 47%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .cut-line {
            border-top: 2px dashed #9ca3af;
            text-align: center;
            color: #6b7280;
            font-size: 12px;
            margin: 15px 0;
            position: relative;
        }
        .cut-line span {
            position: relative;
            top: -10px;
            background: #f9fafb;
            padding: 0 10px;
        }
        .soprovod-header {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .soprovod-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .soprovod-grid div {
            border-bottom: 1px solid #000;
            padding: 4px 0;
        }
        .soprovod-grid div span {
            font-weight: bold;
        }
        .soprovod-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 12px;
        }
        .soprovod-table th, .soprovod-table td {
            border: 1px solid #000;
            padding: 6px;
            text-align: center;
        }
        .soprovod-table th { background-color: #f3f4f6; }
        .soprovod-footer {
            font-size: 11px;
            line-height: 1.5;
        }
        .soprovod-signatures {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 5px;
        }

        /* Faktura (Horizontal, 2 parts A5) */
        .faktura-container {
            display: flex;
            gap: 20px;
            height: 100%;
            width: 100%;
        }
        .faktura-part {
            width: 50%;
            border: 1px solid #000;
            padding: 15px;
            box-sizing: border-box;
            font-size: 12px;
        }
        .faktura-vertical-cut {
            border-left: 2px dashed #9ca3af;
            margin: 0 5px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .faktura-vertical-cut span {
            writing-mode: vertical-rl;
            color: #6b7280;
            background: white;
            padding: 10px 0;
            font-size: 11px;
        }
        .faktura-title {
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            margin: 10px 0;
        }
        .faktura-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .faktura-table th, .faktura-table td {
            border: 1px solid #000;
            padding: 6px;
            text-align: left;
        }
        .faktura-table th { background-color: #f3f4f6; text-align: center; }

        /* Print Media */
        @media print {
            body { margin: 0; background: none; color: #000; }
            .no-print { display: none !important; }
            .print-actions { display: none !important; }
            .tabs { display: none !important; }
            .doc-page-vertical {
                width: 210mm;
                height: 297mm;
                page-break-after: always;
                box-shadow: none;
                padding: 10mm;
                margin: 0;
            }
            .doc-page-horizontal {
                width: 297mm;
                height: 210mm;
                page-break-after: always;
                box-shadow: none;
                padding: 10mm;
                margin: 0;
            }
            .cut-line span { background: white; }
            @page {
                size: auto;
                margin: 0;
            }
            #soprovod-tab-content.active { display: block !important; }
            #faktura-tab-content.active { display: block !important; }
        }
    </style>
</head>
<body>

    <div class="no-print">
        <h2>Управление заказом и упаковочными параметрами</h2>
        <div class="grid-inputs">
            <div class="form-group">
                <label>Номер заказа</label>
                <input type="text" id="orderNum" value="76542">
            </div>
            <div class="form-group">
                <label>Наименование заказа</label>
                <input type="text" id="orderName" value="Навигатор">
            </div>
            <div class="form-group">
                <label>Общий тираж (экз.)</label>
                <input type="number" id="totalCopies" value="52300" min="1">
            </div>
            <div class="form-group">
                <label>Стандарт упаковки (пачка)</label>
                <input type="number" id="packSize" value="150" min="1">
            </div>
            <div class="form-group">
                <label>Стандарт паллеты (пачек)</label>
                <input type="number" id="palletSize" value="75" min="1">
            </div>
        </div>
        
        <div class="grid-inputs" style="background: #f0fdf4; padding: 15px; border-radius: 6px; border: 1px solid #bbf7d0;">
            <div class="form-group">
                <label>Доп. неполная 1 (экз)</label>
                <input type="number" id="extra1" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Доп. неполная 2 (экз)</label>
                <input type="number" id="extra2" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Доп. неполная 3 (экз)</label>
                <input type="number" id="extra3" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Доп. неполная 4 (экз)</label>
                <input type="number" id="extra4" value="0" min="0">
            </div>
        </div>

        <div class="main-table-container">
            <table class="main-table">
                <thead>
                    <tr>
                        <th>Номер заказа</th>
                        <th>Наименование</th>
                        <th>Тираж</th>
                        <th>Стандарт упаковки</th>
                        <th>Наличие остат. пачки</th>
                        <th>Итого пачек</th>
                        <th>Стандарт паллеты</th>
                        <th>Кол-во станд. паллет</th>
                        <th>Пачек в остат. паллете</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="calc-row">
                        <td id="tdOrderNum">-</td>
                        <td id="tdOrderName">-</td>
                        <td id="tdTotal">-</td>
                        <td id="tdPackSize">-</td>
                        <td id="tdHasRemainder">-</td>
                        <td id="tdTotalPacks">-</td>
                        <td id="tdPalletSize">-</td>
                        <td id="tdFullPallets">-</td>
                        <td id="tdRemainderPalletPacks">-</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('soprovod')">Сопроводительные листы</button>
            <button class="tab-btn" onclick="switchTab('faktura')">Фактура (А5 х2)</button>
        </div>
        
        <div class="print-actions">
            <button class="btn-print" onclick="window.print()">
                <span>🖨️ Распечатать текущий документ</span>
            </button>
        </div>
    </div>

    <!-- TAB 1: SOPROVODITELNYE LISTY -->
    <div id="soprovod-tab-content" class="tab-content active">
        <div id="soprovodPagesContainer"></div>
    </div>

    <!-- TAB 2: FAKTURA -->
    <div id="faktura-tab-content" class="tab-content">
        <div class="doc-page-horizontal">
            <div class="faktura-container" id="fakturaContainer">
                <!-- Will be dynamically generated twice side-by-side -->
            </div>
        </div>
    </div>

    <script>
        // Track inputs
        const inputs = ['orderNum', 'orderName', 'totalCopies', 'packSize', 'palletSize', 'extra1', 'extra2', 'extra3', 'extra4'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', calculateData);
        });

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if(tab === 'soprovod') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('soprovod-tab-content').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('faktura-tab-content').classList.add('active');
            }
        }

        function calculateData() {
            const orderNum = document.getElementById('orderNum').value;
            const orderName = document.getElementById('orderName').value;
            const totalCopies = parseInt(document.getElementById('totalCopies').value) || 0;
            const packSize = parseInt(document.getElementById('packSize').value) || 1;
            const palletSize = parseInt(document.getElementById('palletSize').value) || 1;
            
            const e1 = parseInt(document.getElementById('extra1').value) || 0;
            const e2 = parseInt(document.getElementById('extra2').value) || 0;
            const e3 = parseInt(document.getElementById('extra3').value) || 0;
            const e4 = parseInt(document.getElementById('extra4').value) || 0;
            
            const totalExtraCopies = e1 + e2 + e3 + e4;
            let extraPacksCount = 0;
            let activeExtraPacks = [];
            [e1, e2, e3, e4].forEach((val, idx) => {
                if(val > 0) {
                    extraPacksCount++;
                    activeExtraPacks.push({ name: `доп. пач. ${idx+1}`, size: val });
                }
            });

            // Base copies calculation
            const mainCopies = Math.max(0, totalCopies - totalExtraCopies);
            const fullPacks = Math.floor(mainCopies / packSize);
            const remainderCopies = mainCopies % packSize;
            
            const hasMainRemainder = remainderCopies > 0;
            const totalPacks = fullPacks + (hasMainRemainder ? 1 : 0) + extraPacksCount;
            
            const fullPallets = Math.floor(totalPacks / palletSize);
            const remainderPalletPacks = totalPacks % palletSize;
            const totalPallets = fullPallets + (remainderPalletPacks > 0 ? 1 : 0);

            // Update Main Panel Table
            document.getElementById('tdOrderNum').innerText = orderNum;
            document.getElementById('tdOrderName').innerText = orderName;
            document.getElementById('tdTotal').innerText = totalCopies.toLocaleString();
            document.getElementById('tdPackSize').innerText = packSize;
            
            const remBadge = document.getElementById('tdHasRemainder');
            if(hasMainRemainder) {
                remBadge.innerHTML = `<span class="status-badge status-yes">ДА (${remainderCopies} экз.)</span>`;
            } else {
                remBadge.innerHTML = `<span class="status-badge status-no">НЕТ</span>`;
            }
            
            document.getElementById('tdTotalPacks').innerText = totalPacks;
            document.getElementById('tdPalletSize').innerText = palletSize;
            document.getElementById('tdFullPallets').innerText = fullPallets;
            document.getElementById('tdRemainderPalletPacks').innerText = remainderPalletPacks;

            // Generate Soprovoditelnye Listy
            generateSoprovoditelnye(totalPallets, fullPallets, remainderPalletPacks, orderNum, orderName, packSize, palletSize, fullPacks, hasMainRemainder, remainderCopies, activeExtraPacks, totalCopies);
            
            // Generate Faktura
            generateFaktura(orderNum, orderName, totalCopies, fullPacks, packSize, hasMainRemainder, remainderCopies, activeExtraPacks);
        }

        function generateSoprovoditelnye(totalPallets, fullPallets, remainderPalletPacks, orderNum, orderName, packSize, palletSize, fullPacks, hasMainRemainder, remainderCopies, activeExtraPacks, totalCopies) {
            const container = document.getElementById('soprovodPagesContainer');
            container.innerHTML = '';

            if(totalPallets === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#6b7280;">Нет данных для формирования паллет</div>';
                return;
            }

            for(let i = 1; i <= totalPallets; i++) {
                const isRemainderPallet = (i === totalPallets && remainderPalletPacks > 0);
                
                let totalPacksOnThisPallet = isRemainderPallet ? remainderPalletPacks : palletSize;
                let totalCopiesOnThisPallet = 0;
                let breakdownText = '';

                if (!isRemainderPallet) {
                    // Full Standard Pallet
                    totalCopiesOnThisPallet = palletSize * packSize;
                    breakdownText = `Всего пачек: ${palletSize}<br>👉 ${palletSize} цел. пач. по ${packSize} экз.`;
                } else {
                    // Remainder Pallet - gathers everything at the end
                    let parts = [];
                    let remainingFullPacksForThisPallet = remainderPalletPacks;

                    // Figure out what goes into this remainder pallet
                    // We know total copies on this pallet is totalCopies - (fullPallets * palletSize * packSize)
                    totalCopiesOnThisPallet = totalCopies - (fullPallets * palletSize * packSize);

                    // Reconstruct breakdown of packs specifically for the remainder pallet
                    let packsCalculated = 0;
                    
                    // 1. Regular full packs remaining?
                    // How many regular packs were already distributed? fullPallets * palletSize
                    let distributedRegularPacks = fullPallets * palletSize;
                    let totalAvailableRegularFullPacks = fullPacks;
                    let regularFullPacksOnThisPallet = Math.max(0, totalAvailableRegularFullPacks - distributedRegularPacks);
                    
                    if (regularFullPacksOnThisPallet > 0) {
                        parts.push(`${regularFullPacksOnThisPallet} цел. пач. по ${packSize} экз.`);
                        packsCalculated += regularFullPacksOnThisPallet;
                    }

                    // 2. Main remainder pack?
                    if (hasMainRemainder) {
                        parts.push(`1 остат. пач. (${remainderCopies} экз.)`);
                        packsCalculated += 1;
                    }

                    // 3. Extra manual packs?
                    activeExtraPacks.forEach(ep => {
                        parts.push(`1 ${ep.name} (${ep.size} экз.)`);
                        packsCalculated += 1;
                    });

                    breakdownText = `Всего пачек: ${totalPacksOnThisPallet}<br>👉 ` + parts.join(' + ');
                }

                const pageHtml = `
                    <div class="doc-page-vertical">
                        <div class="soprovod-container">
                            <!-- PART 1 -->
                            <div class="soprovod-part">
                                <div class="soprovod-header">АО «Советская Сибирь»<br>Сопроводительный лист (Паспорт паллеты)</div>
                                <div class="soprovod-grid">
                                    <div>Номер заказа: <span>${orderNum}</span></div>
                                    <div>Наименование: <span>${orderName}</span></div>
                                    <div>Паллета №: <span>${i} из ${totalPallets}</span></div>
                                    <div>Дата: <span>${new Date().toLocaleDateString('ru-RU')}</span></div>
                                </div>
                                <table class="soprovod-table">
                                    <thead>
                                        <tr>
                                            <th>Назначение</th>
                                            <th>Кол-во в экз-рах</th>
                                            <th>Кол-во в пачках и расшифровка</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td style="font-size:10px; text-align:left; width:35%;">ПБЦ, ОЦ, Цех упаковки, ИД «Вояж», Склад №1(ЦЭ), Склад №2</td>
                                            <td style="font-size:16px; font-weight:bold;">${totalCopiesOnThisPallet.toLocaleString()}</td>
                                            <td style="text-align:left; font-size:12px; line-height:1.4;">${breakdownText}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div class="soprovod-footer">
                                    <div class="soprovod-signatures">
                                        <div>Сдал цех: _________________</div>
                                        <div>Принял (ЦЭ): _________________</div>
                                        <div>Сдал (подпись): ___________ Время: ____</div>
                                        <div>Получатель: _______________ Время: ____</div>
                                    </div>
                                </div>
                            </div>

                            <!-- CUT LINE -->
                            <div class="cut-line"><span>✂ Линия отреза (Дубликат паспорта)</span></div>

                            <!-- PART 2 (DUPLICATE) -->
                            <div class="soprovod-part">
                                <div class="soprovod-header">АО «Советская Сибирь»<br>Сопроводительный лист (Паспорт паллеты)</div>
                                <div class="soprovod-grid">
                                    <div>Номер заказа: <span>${orderNum}</span></div>
                                    <div>Наименование: <span>${orderName}</span></div>
                                    <div>Паллета №: <span>${i} из ${totalPallets}</span></div>
                                    <div>Дата: <span>${new Date().toLocaleDateString('ru-RU')}</span></div>
                                </div>
                                <table class="soprovod-table">
                                    <thead>
                                        <tr>
                                            <th>Назначение</th>
                                            <th>Кол-во в экз-рах</th>
                                            <th>Кол-во в пачках и расшифровка</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td style="font-size:10px; text-align:left; width:35%;">ПБЦ, ОЦ, Цех упаковки, ИД «Вояж», Склад №1(ЦЭ), Склад №2</td>
                                            <td style="font-size:16px; font-weight:bold;">${totalCopiesOnThisPallet.toLocaleString()}</td>
                                            <td style="text-align:left; font-size:12px; line-height:1.4;">${breakdownText}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div class="soprovod-footer">
                                    <div class="soprovod-signatures">
                                        <div>Сдал цех: _________________</div>
                                        <div>Принял (ЦЭ): _________________</div>
                                        <div>Сдал (подпись): ___________ Время: ____</div>
                                        <div>Получатель: _______________ Время: ____</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += pageHtml;
            }
        }

        function generateFaktura(orderNum, orderName, totalCopies, fullPacks, packSize, hasMainRemainder, remainderCopies, activeExtraPacks) {
            const container = document.getElementById('fakturaContainer');
            
            // Build remark string
            let remarkParts = [];
            if(fullPacks > 0) {
                remarkParts.push(`${fullPacks} пач. x ${packSize} экз.`);
            }
            if(hasMainRemainder) {
                remarkParts.push(`1 пач. x ${remainderCopies} экз.`);
            }
            activeExtraPacks.forEach(ep => {
                remarkParts.push(`1 пач. x ${ep.size} экз. (${ep.name})`);
            });
            
            const remarkText = remarkParts.length > 0 ? remarkParts.join('<br>+ ') : 'Стандартная упаковка';

            const singleFakturaHtml = `
                <div class="faktura-part">
                    <div style="font-weight:bold; text-align:center;">АО «Советская Сибирь»</div>
                    <div style="font-size:10px; text-align:center; margin-bottom:5px;">г. Новосибирск</div>
                    <div style="text-align:right; font-size:10px;">«_____»______________________20___г.</div>
                    
                    <div class="faktura-title">Фактура № _____</div>
                    
                    <div style="margin-bottom:4px;"><b>Кому:</b> ____________________________________________________</div>
                    <div style="margin-bottom:10px;"><b>Через кого:</b> ______________________________________________</div>
                    
                    <table class="faktura-table">
                        <thead>
                            <tr>
